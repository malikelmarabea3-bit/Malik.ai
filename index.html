<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Malik — ذكاء اصطناعي</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #C9A84C; --gold-light: #E8C97A; --gold-dim: rgba(201,168,76,0.15);
    --dark: #0A0A0A; --dark2: #111111; --dark3: #1A1A1A; --dark4: #222222;
    --text: #F0EAD6; --text-muted: #7A7060; --border: rgba(201,168,76,0.2);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Tajawal', sans-serif; background: var(--dark); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  .ambient { position: fixed; width: 600px; height: 600px; border-radius: 50%; background: radial-gradient(circle, rgba(201,168,76,0.06) 0%, transparent 70%); top: -200px; left: 50%; transform: translateX(-50%); pointer-events: none; z-index: 0; }
  header { position: relative; z-index: 10; display: flex; align-items: center; justify-content: space-between; padding: 18px 28px; border-bottom: 1px solid var(--border); background: rgba(10,10,10,0.9); backdrop-filter: blur(20px); }
  .logo { display: flex; align-items: center; gap: 12px; }
  .logo-icon { width: 38px; height: 38px; background: linear-gradient(135deg, var(--gold), var(--gold-light)); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 900; color: #0A0A0A; box-shadow: 0 0 20px rgba(201,168,76,0.4); }
  .logo-text { font-size: 22px; font-weight: 700; background: linear-gradient(135deg, var(--gold-light), var(--gold)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 2px; }
  .logo-sub { font-size: 10px; color: var(--text-muted); letter-spacing: 3px; text-transform: uppercase; margin-top: -2px; }
  .header-actions { display: flex; gap: 10px; align-items: center; }
  .btn-subscribe { background: linear-gradient(135deg, var(--gold), var(--gold-light)); color: #0A0A0A; border: none; padding: 8px 20px; border-radius: 8px; font-family: 'Tajawal', sans-serif; font-size: 13px; font-weight: 700; cursor: pointer; transition: all 0.3s; }
  .btn-subscribe:hover { box-shadow: 0 0 25px rgba(201,168,76,0.5); transform: translateY(-1px); }
  .btn-new { background: var(--dark3); color: var(--text-muted); border: 1px solid var(--border); padding: 8px 16px; border-radius: 8px; font-family: 'Tajawal', sans-serif; font-size: 13px; cursor: pointer; transition: all 0.3s; }
  .btn-new:hover { color: var(--gold); border-color: var(--gold); }
  .chat-container { flex: 1; overflow-y: auto; padding: 30px 20px; position: relative; z-index: 1; scroll-behavior: smooth; }
  .chat-container::-webkit-scrollbar { width: 4px; }
  .chat-container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .chat-inner { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
  .welcome { text-align: center; padding: 60px 20px 40px; animation: fadeUp 0.8s ease; }
  .welcome-crown { font-size: 48px; margin-bottom: 16px; filter: drop-shadow(0 0 20px rgba(201,168,76,0.5)); animation: float 3s ease-in-out infinite; }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  .welcome h1 { font-size: 42px; font-weight: 900; background: linear-gradient(135deg, var(--gold-light), var(--gold), #A07830); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 4px; margin-bottom: 10px; }
  .welcome p { color: var(--text-muted); font-size: 15px; font-weight: 300; letter-spacing: 1px; }
  .suggestions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 32px; }
  .suggestion-btn { background: var(--dark3); border: 1px solid var(--border); color: var(--text); padding: 10px 18px; border-radius: 50px; font-family: 'Tajawal', sans-serif; font-size: 13px; cursor: pointer; transition: all 0.3s; }
  .suggestion-btn:hover { background: var(--gold-dim); border-color: var(--gold); color: var(--gold-light); transform: translateY(-2px); }
  .message { display: flex; gap: 14px; animation: fadeUp 0.4s ease; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  .message.user { flex-direction: row-reverse; }
  .msg-avatar { width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; }
  .msg-avatar.ai { background: linear-gradient(135deg, var(--gold), var(--gold-light)); color: #0A0A0A; box-shadow: 0 0 15px rgba(201,168,76,0.3); }
  .msg-avatar.human { background: var(--dark4); border: 1px solid var(--border); color: var(--text-muted); }
  .msg-bubble { max-width: 70%; padding: 14px 18px; border-radius: 16px; font-size: 15px; line-height: 1.7; }
  .message.ai .msg-bubble { background: var(--dark3); border: 1px solid var(--border); border-radius: 4px 16px 16px 16px; }
  .message.user .msg-bubble { background: linear-gradient(135deg, rgba(201,168,76,0.2), rgba(201,168,76,0.1)); border: 1px solid rgba(201,168,76,0.3); border-radius: 16px 4px 16px 16px; }
  .typing-indicator { display: flex; gap: 5px; align-items: center; padding: 6px 0; }
  .typing-dot { width: 7px; height: 7px; background: var(--gold); border-radius: 50%; animation: typing 1.2s ease-in-out infinite; }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typing { 0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); } 40% { opacity: 1; transform: scale(1.1); } }
  .input-area { position: relative; z-index: 10; padding: 16px 20px 20px; background: rgba(10,10,10,0.95); border-top: 1px solid var(--border); backdrop-filter: blur(20px); }
  .input-wrapper { max-width: 780px; margin: 0 auto; display: flex; gap: 12px; align-items: flex-end; background: var(--dark3); border: 1px solid var(--border); border-radius: 16px; padding: 12px 16px; transition: border-color 0.3s, box-shadow 0.3s; }
  .input-wrapper:focus-within { border-color: rgba(201,168,76,0.5); box-shadow: 0 0 30px rgba(201,168,76,0.1); }
  #userInput { flex: 1; background: transparent; border: none; outline: none; color: var(--text); font-family: 'Tajawal', sans-serif; font-size: 15px; resize: none; max-height: 120px; min-height: 24px; line-height: 1.6; direction: rtl; }
  #userInput::placeholder { color: var(--text-muted); font-size: 14px; }
  #sendBtn { width: 40px; height: 40px; background: linear-gradient(135deg, var(--gold), var(--gold-light)); border: none; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.3s; box-shadow: 0 0 15px rgba(201,168,76,0.3); }
  #sendBtn:hover:not(:disabled) { box-shadow: 0 0 25px rgba(201,168,76,0.6); transform: scale(1.05); }
  #sendBtn:disabled { opacity: 0.4; cursor: not-allowed; }
  #sendBtn svg { width: 18px; height: 18px; fill: #0A0A0A; }
  .input-footer { max-width: 780px; margin: 8px auto 0; text-align: center; font-size: 11px; color: var(--text-muted); }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); z-index: 100; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
  .modal-overlay.active { opacity: 1; pointer-events: all; }
  .modal { background: var(--dark2); border: 1px solid var(--border); border-radius: 20px; padding: 40px; width: 360px; text-align: center; transform: translateY(20px); transition: transform 0.3s; box-shadow: 0 0 60px rgba(201,168,76,0.15); }
  .modal-overlay.active .modal { transform: translateY(0); }
  .modal-icon { font-size: 40px; margin-bottom: 16px; }
  .modal h2 { font-size: 24px; font-weight: 700; background: linear-gradient(135deg, var(--gold-light), var(--gold)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px; }
  .modal p { color: var(--text-muted); font-size: 14px; line-height: 1.6; margin-bottom: 24px; }
  .price-tag { background: var(--gold-dim); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 24px; }
  .price-amount { font-size: 36px; font-weight: 900; color: var(--gold-light); }
  .price-period { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
  .price-features { list-style: none; text-align: right; margin-bottom: 24px; display: flex; flex-direction: column; gap: 10px; }
  .price-features li { font-size: 13px; color: var(--text); display: flex; align-items: center; gap: 8px; }
  .price-features li::before { content: '✦'; color: var(--gold); font-size: 10px; }
  .btn-modal-subscribe { width: 100%; background: linear-gradient(135deg, var(--gold), var(--gold-light)); color: #0A0A0A; border: none; padding: 14px; border-radius: 12px; font-family: 'Tajawal', sans-serif; font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.3s; margin-bottom: 12px; }
  .btn-modal-close { background: transparent; border: none; color: var(--text-muted); font-family: 'Tajawal', sans-serif; font-size: 13px; cursor: pointer; }
</style>
</head>
<body>
<div class="ambient"></div>
<header>
  <div class="logo">
    <div class="logo-icon">M</div>
    <div>
      <div class="logo-text">MALIK</div>
      <div class="logo-sub">ذكاء اصطناعي</div>
    </div>
  </div>
  <div class="header-actions">
    <button class="btn-new" onclick="clearChat()">+ محادثة جديدة</button>
    <button class="btn-subscribe" onclick="openModal()">اشترك الآن — ١٠ جنيه</button>
  </div>
</header>
<div class="chat-container" id="chatContainer">
  <div class="chat-inner" id="chatInner">
    <div class="welcome" id="welcomeScreen">
      <div class="welcome-crown">♛</div>
      <h1>MALIK</h1>
      <p>مساعدك الذكي — اسأل عن أي شيء</p>
      <div class="suggestions">
        <button class="suggestion-btn" onclick="sendSuggestion(this)">✍️ ساعدني في الكتابة</button>
        <button class="suggestion-btn" onclick="sendSuggestion(this)">💡 أعطني أفكار إبداعية</button>
        <button class="suggestion-btn" onclick="sendSuggestion(this)">📚 اشرح لي مفهوم</button>
        <button class="suggestion-btn" onclick="sendSuggestion(this)">💻 ساعدني في الكود</button>
        <button class="suggestion-btn" onclick="sendSuggestion(this)">🌍 ترجم نص</button>
      </div>
    </div>
  </div>
</div>
<div class="input-area">
  <div class="input-wrapper">
    <textarea id="userInput" placeholder="اكتب رسالتك هنا..." rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    <button id="sendBtn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24"><path d="M2 12L22 2L12 22L10 14L2 12Z"/></svg>
    </button>
  </div>
  <div class="input-footer">Malik AI · مدعوم بالذكاء الاصطناعي</div>
</div>
<div class="modal-overlay" id="modalOverlay" onclick="closeModalOutside(event)">
  <div class="modal">
    <div class="modal-icon">♛</div>
    <h2>اشترك في Malik</h2>
    <p>احصل على وصول كامل لذكاء Malik الاصطناعي</p>
    <div class="price-tag">
      <div class="price-amount">١٠ جنيه</div>
      <div class="price-period">في الشهر فقط</div>
    </div>
    <ul class="price-features">
      <li>محادثات غير محدودة</li>
      <li>ردود سريعة وذكية</li>
      <li>دعم اللغة العربية بالكامل</li>
      <li>متاح ٢٤/٧ بدون انقطاع</li>
    </ul>
    <button class="btn-modal-subscribe">اشترك الآن</button>
    <button class="btn-modal-close" onclick="closeModal()">ليس الآن</button>
  </div>
</div>
<script>
  const GROQ_KEY = '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';
  const conversationHistory = [];
  let isLoading = false;

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  }
  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  }
  function sendSuggestion(btn) {
    document.getElementById('userInput').value = btn.textContent.slice(2).trim();
    sendMessage();
  }
  function getWelcomeHTML() {
    return `<div class="welcome" id="welcomeScreen">
      <div class="welcome-crown">♛</div>
      <h1>MALIK</h1>
      <p>مساعدك الذكي — اسأل عن أي شيء</p>
      <div class="suggestions">
        <button class="suggestion-btn" onclick="sendSuggestion(this)">✍️ ساعدني في الكتابة</button>
        <button class="suggestion-btn" onclick="sendSuggestion(this)">💡 أعطني أفكار إبداعية</button>
        <button class="suggestion-btn" onclick="sendSuggestion(this)">📚 اشرح لي مفهوم</button>
        <button class="suggestion-btn" onclick="sendSuggestion(this)">💻 ساعدني في الكود</button>
        <button class="suggestion-btn" onclick="sendSuggestion(this)">🌍 ترجم نص</button>
      </div>
    </div>`;
  }
  function clearChat() {
    conversationHistory.length = 0;
    document.getElementById('chatInner').innerHTML = getWelcomeHTML();
  }
  function addMessage(role, text) {
    const welcome = document.getElementById('welcomeScreen');
    if (welcome) welcome.remove();
    const chatInner = document.getElementById('chatInner');
    const div = document.createElement('div');
    div.className = `message ${role}`;
    div.innerHTML = `
      <div class="msg-avatar ${role === 'ai' ? 'ai' : 'human'}">${role === 'ai' ? '♛' : '؟'}</div>
      <div class="msg-bubble">${text.replace(/\n/g, '<br>')}</div>`;
    chatInner.appendChild(div);
    document.getElementById('chatContainer').scrollTop = 999999;
  }
  function addTyping() {
    const welcome = document.getElementById('welcomeScreen');
    if (welcome) welcome.remove();
    const div = document.createElement('div');
    div.className = 'message ai';
    div.id = 'typingMsg';
    div.innerHTML = `<div class="msg-avatar ai">♛</div><div class="msg-bubble"><div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div></div>`;
    document.getElementById('chatInner').appendChild(div);
    document.getElementById('chatContainer').scrollTop = 999999;
  }
  function removeTyping() {
    const t = document.getElementById('typingMsg');
    if (t) t.remove();
  }
  async function sendMessage() {
    const input = document.getElementById('userInput');
    const text = input.value.trim();
    if (!text || isLoading) return;
    isLoading = true;
    input.value = '';
    input.style.height = 'auto';
    document.getElementById('sendBtn').disabled = true;
    addMessage('user', text);
    conversationHistory.push({ role: 'user', content: text });
    addTyping();
    try {
      const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${GROQ_KEY}`
        },
        body: JSON.stringify({
          model: 'llama3-8b-8192',
          messages: [
            { role: 'system', content: 'أنت Malik، مساعد ذكاء اصطناعي عربي متطور وأنيق. ردودك باللغة العربية دائماً، موجزة وذكية ومفيدة.' },
            ...conversationHistory
          ]
        })
      });
      const data = await res.json();
      const reply = data.choices?.[0]?.message?.content || 'عذراً، حدث خطأ.';
      removeTyping();
      addMessage('ai', reply);
      conversationHistory.push({ role: 'assistant', content: reply });
    } catch (err) {
      removeTyping();
      addMessage('ai', 'عذراً، تعذّر الاتصال. تحقق من الإنترنت وحاول مجدداً.');
    }
    isLoading = false;
    document.getElementById('sendBtn').disabled = false;
    input.focus();
  }
  function openModal() { document.getElementById('modalOverlay').classList.add('active'); }
  function closeModal() { document.getElementById('modalOverlay').classList.remove('active'); }
  function closeModalOutside(e) { if (e.target === document.getElementById('modalOverlay')) closeModal(); }
</script>
</body>
</html>
